<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <h1>Conway's Game of Life</h1>
    <div id="speedSliderContainer">
        <label id="speedLabel" for="speedSlider">Speed: <span id="speedValue">500</span> ms/frame</label>
        <input type="range" id="speedSlider" min="100" max="1000" value="500" step="50">
    </div>
    <div id="controlButtons">
        <button id="pauseButton"><i class="fa-solid fa-play"></i></button>
        <button id="resetButton"><i class="fa-solid fa-rotate-left"></i></button>
        <button id="clearButton"><i class="fa-solid fa-trash"></i></button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script src="grid.js"></script>
    <script src="game.js"></script>
    <script src="controlls.js"></script>

    <footer>
        <!-- Mail Adresse und GitHub Referenz hier -->
    </footer>
</body>

</html>
