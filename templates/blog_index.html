<!doctype html>
<html lang="{lang}">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>{page_title} - Pablo Schmeiser</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css"
    />
    <link rel="stylesheet" href="/style.css" />

    <style>
      .post-card {{ transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }}
      .post-card:hover {{ transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2) !important; }}
      .post-link {{ text-decoration: none; color: inherit; display: block; height: 100%; }}
      .card-text-excerpt {{ display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: #cbd5e1; }}
    </style>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark glass-navbar fixed-top"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="/{lang}/">Pablo Schmeiser</a>
        <button
          class="navbar-toggler"
          type="button"
          data-mdb-collapse-init
          data-mdb-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fas fa-bars"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/{lang}/">Resume</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/{lang}/blog/"
                >Blog</a
              >
            </li>
            <li class="nav-item ms-3 language-switcher">
              <a class="nav-link fw-bold" href="/{other_lang}/blog/"
                ><span class="badge rounded-pill bg-light text-dark"
                  >{other_lang_flag}</span
                ></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div
      class="hero-section text-center text-white d-flex align-items-center justify-content-center"
      style="height: 40vh"
    >
      <div class="hero-content container">
        <h1 class="display-3 fw-bold mb-3">{page_title}</h1>
        <p class="text-muted fs-5">{page_description}</p>
      </div>
    </div>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="row row-cols-1 row-cols-md-2 g-4">
            {posts}
          </div>
        </div>
      </div>
    </main>

    <footer
      class="bg-dark text-center text-white mt-auto glass-card"
      style="border-radius: 0"
    >
      <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2)">
        © 2026 Pablo Schmeiser
      </div>
    </footer>

    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.umd.min.js"
    ></script>
  </body>
</html>
