name: Deploy and Translate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Build Blog (Markdown to HTML)
        run: python scripts/build_blog.py

      - name: Translate changed files
        run: python scripts/translate.py
        
      - name: LLM Translation Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/llm_review.py
        
      - name: Create Pull Request for Translations
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update translations and blog html"
          title: "chore: update translations and blog html"
          branch: "update-translations"
          body: "This PR was automatically generated by the LLM Translation Review pipeline."
          
      - name: Setup Pages
        if: steps.cpr.outputs.pull-request-number == ''
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        if: steps.cpr.outputs.pull-request-number == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only deploy if the build job successfully uploaded artifacts (meaning no PR was created)
    if: success()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
