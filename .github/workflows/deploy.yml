name: Deploy and Translate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build Blog (Markdown to HTML)
        run: python scripts/build_blog.py

      - name: Translate changed files
        run: python scripts/translate.py

      - name: LLM Translation Review
        if: "${{ !contains(github.event.head_commit.message, 'chore: update translations') && github.actor != 'github-actions[bot]' }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/llm_review.py

      - name: Create Pull Request for Translations
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update translations and blog html"
          title: "chore: update translations and blog html"
          branch: "update-translations"
          body: "This PR was automatically generated by the LLM Translation Review pipeline."

      - name: Generate Blog Indexes
        run: python scripts/generate_blog_index.py

      - name: Setup Pages
        if: steps.cpr.outputs.pull-request-number == ''
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: steps.cpr.outputs.pull-request-number == ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Only deploy if the build job successfully uploaded artifacts (meaning no PR was created)
    if: success()
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
